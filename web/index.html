<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Live Tracker</title>
<style>
  :root {
    --bg: #111317; --panel: #1a1d23; --text: #e8e8ea; --muted: #8b8f98;
    --track: #3a3f4a; --track-edge: #4b5160; --line: #e8e8ea; --pit: #2c3038;
    --sc: #f5c518; --red: #e5484d; --green: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; height: 100%; }
  #tower { width: 250px; flex: none; background: var(--panel); overflow-y: auto; padding: 10px 0; }
  #tower h1 { font-size: 14px; margin: 0 12px 2px; }
  #tower .sub { color: var(--muted); margin: 0 12px 8px; font-size: 12px; }
  .row { display: grid; grid-template-columns: 26px 6px 44px 1fr 22px; gap: 6px; align-items: center;
    padding: 3px 12px; font-variant-numeric: tabular-nums; }
  .row .pos { text-align: right; color: var(--muted); }
  .row .bar { width: 4px; height: 14px; border-radius: 2px; }
  .row .code { font-weight: 600; }
  .row .gap { text-align: right; color: var(--muted); }
  .row .tyre { text-align: center; font-weight: 700; font-size: 11px; }
  .row.pit .gap::after { content: " PIT"; color: var(--sc); }
  .row.out { opacity: .4; }
  #outlist { margin-top: 10px; padding-top: 6px; border-top: 1px solid #2a2e36; }
  #outlist .label { color: var(--muted); margin: 0 12px 4px; font-size: 11px; letter-spacing: .05em; }
  #main { position: relative; flex: 1; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #status { position: absolute; top: 10px; right: 12px; display: flex; gap: 8px; align-items: center; }
  .pill { padding: 3px 8px; border-radius: 10px; background: var(--panel); font-size: 12px; }
  .pill.sc { background: var(--sc); color: #000; font-weight: 700; }
  .pill.red { background: var(--red); font-weight: 700; }
  .pill.conn-bad { background: var(--red); }
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #tower { width: 100%; height: 40%; order: 2; }
    #main { height: 60%; flex: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="tower">
    <h1 id="title">F1 Live Tracker</h1>
    <div class="sub" id="subtitle">connecting…</div>
    <div id="rows"></div>
    <div id="outlist"></div>
  </div>
  <div id="main">
    <canvas id="c"></canvas>
    <div id="status">
      <span class="pill" id="lap"></span>
      <span class="pill" id="flag"></span>
      <span class="pill" id="conn">●</span>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
