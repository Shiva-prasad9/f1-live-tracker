<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Live Tracker</title>
<style>
  :root {
    --bg: #111317; --panel: #1a1d23; --text: #e8e8ea; --muted: #8b8f98;
    --track: #3d4352; --track-edge: #566078; --line: #e8e8ea; --pit: #2c3038;
    --sc: #f5c518; --red: #e5484d; --green: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; height: 100%; }
  #tower { width: 250px; flex: none; background: var(--panel); overflow-y: auto; padding: 10px 0; }
  #tower h1 { font-size: 14px; margin: 0 12px 2px; }
  #tower .sub { color: var(--muted); margin: 0 12px 8px; font-size: 12px; }
  .row { display: grid; grid-template-columns: 26px 6px 44px 1fr 22px; gap: 6px; align-items: center;
    padding: 3px 12px; font-variant-numeric: tabular-nums; }
  .row .pos { text-align: right; color: var(--muted); }
  .row .bar { width: 4px; height: 14px; border-radius: 2px; }
  .row .code { font-weight: 600; }
  .row .gap { text-align: right; color: var(--muted); }
  .row .tyre { text-align: center; font-weight: 700; font-size: 11px; }
  .row.pit .gap::after { content: " PIT"; color: var(--sc); }
  .row.out { opacity: .4; }
  #outlist { margin-top: 10px; padding-top: 6px; border-top: 1px solid #2a2e36; }
  #outlist .label { color: var(--muted); margin: 0 12px 4px; font-size: 11px; letter-spacing: .05em; }
  #main { position: relative; flex: 1; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bg { pointer-events: none; }
  #wx { position: absolute; right: 12px; bottom: 12px; display: none; padding: 8px 12px; border-radius: 12px; background: #14171dcc;
    backdrop-filter: blur(6px); font-size: 12px; box-shadow: 0 4px 18px #0008; line-height: 1.5; font-variant-numeric: tabular-nums; }
  #wx .big { font-size: 15px; font-weight: 700; } #wx .m { color: var(--muted); }
  #wx .arrow { display: inline-block; transition: transform .6s; color: #7fb4ff; }
  #wx.rain { box-shadow: 0 0 16px #4c8dff66; border: 1px solid #4c8dff55; }
  body.fx-on #main { background: radial-gradient(ellipse at 50% 40%, #151a2b 0%, #0b0d14 75%); }
  #fxbtn { all: unset; cursor: pointer; padding: 3px 9px; border-radius: 10px; background: var(--panel); font-size: 12px;
    color: var(--muted); } #fxbtn.on { color: #c77dff; box-shadow: 0 0 8px #c77dff55; }
  #status { position: absolute; top: 10px; right: 12px; display: flex; gap: 8px; align-items: center; }
  .pill { padding: 3px 8px; border-radius: 10px; background: var(--panel); font-size: 12px; }
  .pill.sc { background: var(--sc); color: #000; font-weight: 700; }
  .pill.red { background: var(--red); font-weight: 700; }
  .pill.conn-bad { background: var(--red); }
  /* --- replay controls, hover card, toasts, tower effects --- */
  #ctl { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: none; gap: 4px;
    background: var(--panel); padding: 4px; border-radius: 12px; box-shadow: 0 2px 14px #0008; }
  #ctl button { all: unset; cursor: pointer; padding: 4px 9px; border-radius: 8px; color: var(--muted);
    font-weight: 600; font-size: 12px; transition: background .15s, color .15s; }
  #ctl button:hover { background: #262a33; color: var(--text); }
  #ctl button.on { background: #e10600; color: #fff; box-shadow: 0 0 10px #e1060088; }
  #card { position: absolute; pointer-events: none; min-width: 210px; padding: 10px 12px 9px; border-radius: 12px;
    background: #14171dee; border: 1px solid var(--accent, #444); box-shadow: 0 6px 30px #000a, 0 0 18px var(--accent, #0000);
    backdrop-filter: blur(6px); opacity: 0; transform: translateY(6px) scale(.97); transition: opacity .12s, transform .12s; z-index: 5; }
  #card.show { opacity: 1; transform: none; }
  #card .hd { display: flex; align-items: baseline; gap: 8px; }
  #card .code { font-size: 20px; font-weight: 800; letter-spacing: .02em; }
  #card .nm { color: var(--muted); font-size: 12px; }
  #card .team { color: var(--accent); font-size: 11px; margin: 1px 0 7px; }
  #card .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-variant-numeric: tabular-nums; }
  #card .kv span:nth-child(odd) { color: var(--muted); }
  #card .kv span:nth-child(even) { text-align: right; font-weight: 600; }
  .purple { color: #c77dff !important; text-shadow: 0 0 8px #c77dffaa; }
  .green { color: #3fe08a !important; }
  #card .secs { display: flex; gap: 5px; margin-top: 8px; }
  #card .secs div { flex: 1; text-align: center; padding: 2px 0; border-radius: 6px; background: #20242c; font-size: 11px;
    font-variant-numeric: tabular-nums; }
  #card .badge { display: inline-block; margin-top: 7px; padding: 2px 8px; border-radius: 9px; font-size: 11px; font-weight: 700;
    background: #c77dff22; color: #c77dff; border: 1px solid #c77dff66; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 10px #c77dff99; } }
  #toasts { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column-reverse; gap: 6px; pointer-events: none; }
  .toast { padding: 6px 12px; border-radius: 10px; background: #14171dee; border-left: 4px solid var(--c, #888); font-size: 12px;
    box-shadow: 0 4px 18px #0009; animation: tin .25s ease-out, tout .4s ease-in 4.2s forwards; }
  @keyframes tin { from { opacity: 0; transform: translateX(-24px); } }
  @keyframes tout { to { opacity: 0; transform: translateX(-12px); } }
  .row { cursor: pointer; transition: background .15s; border-left: 3px solid transparent; }
  .row:hover, .row.hl { background: #242932; }
  .row.pinned { background: #2a2f3a; border-left-color: var(--c, #fff); }
  .row.up { animation: up 1.4s ease-out; } .row.down { animation: down 1.4s ease-out; }
  @keyframes up { 0% { background: #3fb95066; } 100% { background: transparent; } }
  @keyframes down { 0% { background: #e5484d55; } 100% { background: transparent; } }
  .row .fl { color: #c77dff; font-size: 10px; margin-left: 3px; }
  /* --- race picker --- */
  #picker { position: fixed; inset: 0; z-index: 30; display: none; overflow-y: auto; padding: 24px 16px 40px;
    background: #0b0d14f2; backdrop-filter: blur(4px); }
  #picker .panel { max-width: 820px; margin: 0 auto; }
  #picker h2 { margin: 0 0 4px; font-size: 20px; } #picker .lead { color: var(--muted); margin: 0 0 16px; }
  #picker .close { position: absolute; top: 14px; right: 18px; all: unset; cursor: pointer; font-size: 20px; color: var(--muted); padding: 4px 8px; }
  #picker .close:hover { color: var(--text); }
  .feat { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #1a1d23;
    border: 1px solid #2c3140; margin-bottom: 18px; }
  .feat .t { flex: 1; } .feat .t b { font-size: 14px; } .feat .t span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { all: unset; cursor: pointer; padding: 5px 14px; border-radius: 16px; background: #1a1d23; color: var(--muted); font-weight: 600; }
  .tabs button.on { background: #e10600; color: #fff; box-shadow: 0 0 10px #e1060066; }
  .races { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .race { padding: 10px 12px; border-radius: 10px; background: #161920; border: 1px solid #242833; }
  .race:hover { border-color: #3a4152; } .race .n { font-weight: 600; } .race .m { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  .race .rn { color: #e10600; font-weight: 700; font-size: 11px; margin-right: 6px; }
  .btn { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 8px; background: #262a33; font-weight: 600; font-size: 12px; margin-right: 6px; }
  .btn:hover { background: #313644; } .btn.go { background: #e10600; color: #fff; } .btn.go:hover { background: #ff2a1f; }
  .msg { color: var(--muted); padding: 18px 4px; } .msg.err { color: #ff8a8a; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #444a5a; border-top-color: #e10600; border-radius: 50%;
    animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 8px; } @keyframes sp { to { transform: rotate(360deg); } }
  #picker .fine { color: #6b7080; font-size: 11px; margin-top: 22px; line-height: 1.5; }
  #notice { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); display: none; max-width: 520px; z-index: 6;
    padding: 10px 14px; border-radius: 10px; background: #2a2418; border: 1px solid #f5c51855; color: #f5d675; text-align: center; }
  #tower .foot { color: #5f6472; font-size: 10px; line-height: 1.4; margin: 14px 12px 0; }
  @media (max-width: 700px) {
    #ctl { top: 44px; left: 8px; right: 8px; transform: none; flex-wrap: wrap; justify-content: center; }
    #ctl button { padding: 4px 8px; }
    #status { top: 8px; right: 8px; }
    #app { flex-direction: column; }
    #tower { width: 100%; height: 40%; order: 2; }
    #main { height: 60%; flex: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="tower">
    <h1 id="title">F1 Live Tracker</h1>
    <div class="sub" id="subtitle">connecting…</div>
    <div id="rows"></div>
    <div id="outlist"></div>
    <div class="foot">Unofficial fan project, not associated in any way with the Formula 1 companies.</div>
  </div>
  <div id="main">
    <canvas id="bg"></canvas>
    <canvas id="c"></canvas>
    <div id="ctl"></div>
    <div id="card"></div>
    <div id="wx"></div>
    <div id="notice"></div>
    <div id="picker"></div>
    <div id="toasts"></div>
    <div id="status">
      <span class="pill" id="lap"></span>
      <span class="pill" id="flag"></span>
      <button id="fxbtn" title="Background effects (B)">✦ FX</button>
      <span class="pill" id="conn">●</span>
    </div>
  </div>
</div>
<script src="/static/fx.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
